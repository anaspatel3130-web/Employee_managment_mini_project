# ===================================================================
# Employee Management System - Application Configuration
# ===================================================================

server.port=8080
spring.application.name=employee-management-system

# -------------------------------------------------------------------
# H2 Database Configuration
# Uses a file-based H2 database stored in the ./data directory
# This ensures data persists across application restarts.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/emsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
# 'update' automatically validates and exports schema DDL without wiping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# H2 Web Console Configuration
# Accessible at: http://localhost:8080/h2-console
# JDBC URL to connect: jdbc:h2:file:./data/emsdb
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Static Resources
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
