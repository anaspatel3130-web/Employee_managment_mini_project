<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - ApexEMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <th:block th:replace="~{fragments/header :: header('System Notice')}"></th:block>

            <!-- Page Content -->
            <main class="content-area">
                <div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 2rem;">
                    <div style="font-size: 4rem; line-height: 1; margin-bottom: 1rem;">⚠️</div>
                    <h2 class="card-title" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;" 
                        th:text="${errorTitle != null ? errorTitle : 'An Error Occurred'}">
                        System Notice
                    </h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;" 
                       th:text="${errorMessage != null ? errorMessage : 'An unexpected condition prevented completing this action.'}">
                        An error occurred while processing your request.
                    </p>
                    <div th:if="${errorDetails}" style="background: var(--bg-surface-alt); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-family: monospace; font-size: 0.8rem; color: var(--danger-text);" 
                         th:text="${errorDetails}">
                        Details
                    </div>
                    <div style="display: flex; gap: 0.75rem; justify-content: center;">
                        <a th:href="@{/employees}" class="btn btn-primary">Back to Directory</a>
                        <a th:href="@{/dashboard}" class="btn btn-secondary">Go to Dashboard</a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
