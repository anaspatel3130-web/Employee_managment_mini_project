<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Top Header Fragment -->
    <header class="top-header" th:fragment="header(pageTitle)">
        <div class="header-left">
            <button class="mobile-toggle-btn" id="mobileNavToggle" aria-label="Toggle navigation">
                ☰
            </button>
            <h1 class="page-title" th:text="${pageTitle}">Overview</h1>
        </div>

        <div class="header-right">
            <!-- Dual Theme Selector (Simultaneous White & Neon Options) -->
            <div class="theme-toggle-group" role="group" aria-label="Theme selector">
                <button type="button" id="btnThemeLight" class="theme-pill-btn" onclick="applyTheme('light')" title="Switch to Clean White Theme">
                    <span>☀️</span> White
                </button>
                <button type="button" id="btnThemeNeon" class="theme-pill-btn" onclick="applyTheme('neon-dark')" title="Switch to Cyberpunk Neon Theme">
                    <span>⚡</span> Neon
                </button>
            </div>

            <!-- Dynamic Live Clock -->
            <div class="live-clock" id="liveClock">
                <span>🕒</span> Loading clock...
            </div>

            <!-- Admin Profile Indicator -->
            <div class="admin-badge">
                <div class="admin-avatar">AD</div>
                <div class="admin-info">
                    <span class="admin-name">Admin User</span>
                    <span class="admin-role">System Administrator</span>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
