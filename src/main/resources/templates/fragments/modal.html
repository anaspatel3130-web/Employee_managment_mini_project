<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Delete Confirmation Modal Fragment -->
    <div id="deleteModal" class="modal-overlay" th:fragment="deleteModal">
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header danger">
                <div class="modal-icon">⚠️</div>
                <h3 class="modal-title" id="modalTitle">Confirm Deletion</h3>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to permanently delete this employee?</p>
                <p style="margin-top: 0.75rem; font-weight: 600; color: var(--danger);" id="deleteEmployeeName">
                    Employee Name
                </p>
                <p style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">
                    This will remove their profile, compensation history, and role assignments from the system. This action cannot be undone.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                <form id="deleteForm" method="post" action="#" style="display: inline;">
                    <button type="submit" class="btn btn-danger">Confirm Delete</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
